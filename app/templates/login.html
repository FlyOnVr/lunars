{% extends "base.html" %}
{% block title %}Sign in · License Server{% endblock %}
{% block content_anon %}
<div class="login-wrap">
  <form class="login-card" method="post" action="/admin/login">
    <div class="brand login-brand">
      <span class="dot"></span>
      <div class="brand-name">License Server</div>
    </div>
    <h1>Admin sign in</h1>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <label>Username
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
    <p class="hint">Credentials were generated on first run and printed to the
      server console / <code>FIRST_RUN_CREDENTIALS.txt</code>.</p>
  </form>
</div>
{% endblock %}
