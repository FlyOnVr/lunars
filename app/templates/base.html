<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}License Server{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if request.session.get('admin') %}
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <div class="brand-name">License Server</div>
        <div class="brand-sub">admin</div>
      </div>
    </div>
    <nav>
      <a href="/admin" class="{{ 'active' if active=='home' }}">Overview</a>
      <a href="/admin/keys" class="{{ 'active' if active=='keys' }}">Keys &amp; access</a>
      <a href="/admin/items" class="{{ 'active' if active=='items' }}">Items (payloads)</a>
      <a href="/admin/sessions" class="{{ 'active' if active=='sessions' }}">Sessions</a>
      <a href="/admin/bans" class="{{ 'active' if active=='bans' }}">Bans</a>
      <a href="/admin/events" class="{{ 'active' if active=='events' }}">Event log</a>
    </nav>
    <a class="logout" href="/admin/logout">Log out</a>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
{% else %}
  {% block content_anon %}{% endblock %}
{% endif %}
</body>
</html>
